<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D HDD & SSD — Fotorealistik CAD Simulyator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Three.js, OrbitControls va GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-radial: radial-gradient(circle at 50% 45%, #1e293b 0%, #0f172a 58%, #04070f 100%);
            --glass-bg: rgba(10, 16, 29, 0.78);
            --glass-border: rgba(148, 163, 184, 0.22);
            --text-primary: #f8fafc;
        }
        body.studio-light {
            --bg-radial: radial-gradient(circle at 50% 45%, #ffffff 0%, #f1f5f9 65%, #cbd5e1 100%);
            --glass-bg: rgba(255, 255, 255, 0.86);
            --glass-border: rgba(15, 23, 42, 0.14);
            --text-primary: #0f172a;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-radial);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            transition: background 0.35s ease;
        }
        #canvas-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #callout-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }
        #pins-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
        }
        .glass-dock {
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 18px 42px -10px rgba(0, 0, 0, 0.55);
            pointer-events: auto;
            transition: all 0.25s ease;
        }
        /* Minimalistik 3D Raqamli Pinlar (Ichki qismlarni aslo to'smaydi) */
        .pin-marker {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 9px 3px 3px;
            border-radius: 999px;
            background: rgba(9, 14, 26, 0.88);
            border: 1.5px solid rgba(56, 189, 248, 0.65);
            color: #f8fafc;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s, background 0.2s;
            white-space: nowrap;
        }
        body.studio-light .pin-marker {
            background: rgba(255, 255, 255, 0.94);
            color: #0f172a;
            border-color: #0284c7;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
        }
        .pin-marker:hover {
            transform: translate(-50%, -50%) scale(1.12);
            border-color: #38bdf8;
            z-index: 30;
        }
        .pin-marker.active {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.22);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.55);
            transform: translate(-50%, -50%) scale(1.14);
            z-index: 35;
        }
        body.studio-light .pin-marker.active {
            background: #fef3c7;
            color: #78350f;
        }
        .pin-num {
            width: 21px;
            height: 21px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #1d4ed8);
            color: #ffffff;
            font-weight: 800;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .pin-marker.active .pin-num {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        .pin-label {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.01em;
            padding-right: 2px;
        }
        /* Pastki qism tanlash tugmalari (1..10) */
        .part-pill {
            transition: all 0.18s ease;
        }
        .part-pill.active {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #090d16;
            border-color: #fbbf24;
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.5);
            font-weight: 800;
        }
        /* Range slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, #0284c7, #38bdf8, #f59e0b);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #0284c7;
            margin-top: -5.5px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.8);
        }
        /* Maxsus Neon Glassmorphism Scrollbar Dizayni */
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #06b6d4 rgba(15, 23, 42, 0.55);
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.55);
            border-radius: 999px;
            margin: 0 8px;
            border: 1px solid rgba(148, 163, 184, 0.12);
        }
        body.studio-light .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(203, 213, 225, 0.65);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #06b6d4, #3b82f6, #0284c7);
            border-radius: 999px;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.65);
            transition: all 0.25s ease;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(90deg, #22d3ee, #60a5fa, #f59e0b);
            box-shadow: 0 0 14px rgba(34, 211, 238, 0.95);
        }
        .device-switch-btn {
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .device-switch-btn.active-hdd {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(2, 132, 199, 0.55);
        }
        .device-switch-btn.active-ssd {
            background: linear-gradient(135deg, #06b6d4, #0d9488);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(6, 182, 212, 0.55);
        }
        .device-switch-btn.active-nvme {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(236, 72, 153, 0.55);
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Sahna (100% Ekranda, hech narsa to'smaydi) -->
    <div id="canvas-container"></div>

    <!-- Tashqi Perimetr Ko'rsatkich Chiziqlari -->
    <svg id="callout-svg"></svg>

    <!-- Tashqi Perimetr Raqamli Pinlari (1..10) -->
    <div id="pins-container"></div>

    <!-- YUQORI MINIMAL PANEL: Qurilma Tanlash (HDD / SATA SSD / M.2 NVMe), Ko'rinish Rejimi va Kamera Rakurslari -->
    <header class="fixed top-3 left-3 right-3 z-20 pointer-events-none flex flex-wrap items-center justify-between gap-2">
        <!-- Chap: QURILMANI ALMASHTIRISH (HDD <-> SATA SSD <-> M.2 NVMe) VA HOLAT INDIKATORI -->
        <div class="glass-dock p-1 pr-3.5 rounded-full flex items-center gap-2.5">
            <div class="flex items-center bg-slate-950/60 p-0.5 rounded-full border border-slate-700/50">
                <button id="btn-device-hdd" class="device-switch-btn active-hdd px-2.5 py-1 rounded-full text-[11px] font-extrabold tracking-tight flex items-center gap-1">
                    <span>💿</span>
                    <span>HDD 3.5"</span>
                </button>
                <button id="btn-device-ssd" class="device-switch-btn px-2.5 py-1 rounded-full text-[11px] font-extrabold tracking-tight opacity-75 hover:opacity-100 flex items-center gap-1">
                    <span>⚡</span>
                    <span>SATA SSD</span>
                </button>
                <button id="btn-device-nvme" class="device-switch-btn px-2.5 py-1 rounded-full text-[11px] font-extrabold tracking-tight opacity-75 hover:opacity-100 flex items-center gap-1">
                    <span>🚀</span>
                    <span>M.2 NVMe</span>
                </button>
            </div>
            <div class="h-3.5 w-px bg-slate-600/50"></div>
            <div class="flex items-center gap-1.5">
                <span id="status-led" class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]"></span>
                <span id="rpm-readout" class="mono text-[11px] font-bold text-sky-400">7200 RPM</span>
            </div>
        </div>

        <!-- Markaz: 3 XIL KO'RINISH REJIMI (Ochiq / Yopiq Qopqoq / Parchalash) -->
        <div class="glass-dock p-1 rounded-full flex items-center gap-1 text-[11px]">
            <button id="btn-view-open" class="px-3 py-1 rounded-full font-bold bg-sky-600 text-white shadow transition">
                Ichki Tuzilishi (Ochiq)
            </button>
            <button id="btn-view-closed" class="px-3 py-1 rounded-full font-semibold opacity-75 hover:opacity-100 transition">
                🛡️ Qopqoq / Radiator
            </button>
            <button id="btn-view-explode" class="px-3 py-1 rounded-full font-semibold opacity-75 hover:opacity-100 transition">
                Parchalash (100%)
            </button>
        </div>

        <!-- O'ng: KAMERA RAKURSLARI VA FON TUGMASI -->
        <div class="glass-dock px-2.5 py-1.5 rounded-full flex items-center gap-1.5 text-[11px]">
            <button id="cam-iso" class="px-2 py-0.5 rounded-full hover:bg-sky-500/20 font-semibold transition" title="Standart Izometrik Rakurs">
                📐 Izometrik
            </button>
            <button id="cam-top" class="px-2 py-0.5 rounded-full hover:bg-sky-500/20 font-semibold transition" title="Yuqori Plan">
                ⬆️ Yuqoridan
            </button>
            <button id="cam-front" class="px-2 py-0.5 rounded-full hover:bg-sky-500/20 font-semibold transition" title="Ulagichlar Plani">
                🔌 Ulagich Oldi
            </button>
            <div class="h-3.5 w-px bg-slate-600/50"></div>
            <button id="btn-theme" class="px-2 py-0.5 rounded-full hover:bg-sky-500/20 font-bold transition" title="Oq / Qorong'u Studiya foni">
                ☀️ Fon
            </button>
        </div>
    </header>

    <!-- TANLANGAN QISM KARTOCHKASI (Faqat detal tanlanganda o'ng-yuqori burchakda ixcham chiqadi, 3D modelni to'smaydi) -->
    <aside id="part-info-card" class="custom-scrollbar fixed top-16 right-4 z-20 w-72 md:w-80 max-h-[70vh] overflow-y-auto glass-dock rounded-2xl p-3.5 transition-all duration-300 opacity-0 pointer-events-none translate-x-6">
        <div class="flex items-start justify-between gap-2 pb-2 border-b border-slate-600/30">
            <div class="flex items-center gap-2">
                <span id="card-num" class="w-6 h-6 rounded-full bg-amber-500 text-slate-950 font-extrabold text-xs flex items-center justify-center flex-shrink-0">1</span>
                <div>
                    <h3 id="card-title" class="text-xs md:text-sm font-extrabold leading-tight">Magnit plastinalar</h3>
                    <p id="card-en" class="text-[10px] font-bold text-sky-400 uppercase tracking-wider">PLATTERS</p>
                </div>
            </div>
            <button id="btn-close-card" class="w-6 h-6 rounded-full hover:bg-slate-700/50 flex items-center justify-center text-xs opacity-75 hover:opacity-100 transition" title="Kartochkani yopish va umumiy planga qaytish">
                ✕
            </button>
        </div>
        <p id="card-desc" class="text-[11px] leading-relaxed opacity-90 mt-2">
            Ma'lumotlarni saqlovchi magnit qatlam bilan qoplangan, oyna kabi silliq aylanuvchi disklar.
        </p>
        <div id="card-specs" class="mt-2 pt-2 border-t border-slate-600/30 text-[10px] mono space-y-0.5 text-sky-400">
        </div>
        <div class="mt-2.5 flex items-center gap-1.5">
            <button id="btn-card-zoom" class="flex-1 py-1 px-2.5 rounded-lg bg-sky-500/20 hover:bg-sky-500/30 border border-sky-400/40 text-sky-300 text-[10.5px] font-bold transition">
                🔍 Yaqinroq ko'rish
            </button>
            <button id="btn-card-isolate" class="py-1 px-2.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-amber-300 text-[10.5px] font-bold transition">
                👁️ Yakka o'zi
            </button>
        </div>
    </aside>

    <!-- PASTKI SUZUVCHI KOMPAKT DOCK: 1..10 Qismlar (Dizaynli Scrollbar bilan) + Parchalash Slayderi + Quvvat -->
    <footer class="fixed bottom-3 left-1/2 -translate-x-1/2 z-20 w-[96vw] max-w-4xl pointer-events-none flex flex-col items-center gap-1.5">
        
        <!-- 1 dan 10 gacha qismlarni bir bosishda yaqinlashtiruvchi ixcham qator + chap/o'ng skroll tugmalari -->
        <div class="glass-dock px-2 py-1.5 rounded-2xl flex items-center gap-1.5 w-full">
            <button id="btn-scroll-left" class="w-6 h-6 rounded-full bg-slate-800/90 hover:bg-sky-500/30 text-sky-300 border border-slate-600/50 flex items-center justify-center text-xs font-bold flex-shrink-0 transition" title="Chapga surish">
                ‹
            </button>
            <div id="part-pills-bar" class="custom-scrollbar flex items-center gap-1.5 overflow-x-auto pb-1 pt-0.5 px-1 flex-1 scroll-smooth">
                <button id="btn-all-parts" class="px-2.5 py-1 rounded-full text-[10.5px] font-bold bg-sky-600 text-white whitespace-nowrap transition flex-shrink-0">
                    Barchasi
                </button>
                <!-- 1..10 tugmalar JS orqali qo'shiladi -->
            </div>
            <button id="btn-scroll-right" class="w-6 h-6 rounded-full bg-slate-800/90 hover:bg-sky-500/30 text-sky-300 border border-slate-600/50 flex items-center justify-center text-xs font-bold flex-shrink-0 transition" title="O'ngga surish">
                ›
            </button>
        </div>

        <!-- Asosiy Boshqaruv Slayderi va Tugmalar -->
        <div class="glass-dock px-4 py-2 rounded-full w-full flex flex-wrap items-center justify-between gap-3">
            <!-- Parchalash Slayderi -->
            <div class="flex items-center gap-2.5 flex-1 min-w-[230px]">
                <button id="btn-quick-assemble" class="px-2.5 py-1 rounded-full bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-[10.5px] font-bold border border-slate-600/50 transition whitespace-nowrap">
                    ⬇ Yig'ish
                </button>
                <div class="flex-1 flex items-center gap-2">
                    <input id="explode-range" type="range" min="0" max="100" value="0" class="w-full">
                    <span id="explode-pct" class="mono text-[11px] font-bold text-sky-400 w-9 text-right">0%</span>
                </div>
                <button id="btn-quick-explode" class="px-2.5 py-1 rounded-full bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 text-[10.5px] font-bold border border-amber-400/40 transition whitespace-nowrap">
                    ⬆ Parchalash
                </button>
            </div>

            <div class="hidden sm:block h-4 w-px bg-slate-600/50"></div>

            <!-- Jonli Funksiyalar -->
            <div class="flex items-center gap-1.5">
                <button id="btn-power-toggle" class="px-3 py-1 rounded-full bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/40 text-emerald-300 text-[11px] font-bold transition">
                    ⚡ Quvvat: ON
                </button>
                <button id="btn-speed-toggle" class="px-2.5 py-1 rounded-full bg-purple-500/20 hover:bg-purple-500/30 border border-purple-400/40 text-purple-300 text-[11px] font-bold transition" title="Sekinlashtirilgan rejim">
                    ⏱️ 7200 RPM
                </button>
                <button id="btn-pins-toggle" class="px-2.5 py-1 rounded-full bg-sky-500/20 hover:bg-sky-500/30 border border-sky-400/40 text-sky-300 text-[11px] font-bold transition">
                    🏷️ Raqamlar: ON
                </button>
            </div>
        </div>
    </footer>

    <script>
        // ============================================================================

        // 1) Oyna-Plastinalar uchun Anizotropik Xrom Radial Tekstura
        function makeAnisotropicPlatterTex() {
            const c = document.createElement('canvas');
            c.width = 1024;
            c.height = 1024;
            const ctx = c.getContext('2d');
            const cx = 512, cy = 512;

            ctx.fillStyle = '#e5e9f0';
            ctx.fillRect(0, 0, 1024, 1024);

            // 1-rasmdagi X-simon anizotropik metall shu'lasi
            for (let a = 0; a < 360; a += 0.4) {
                const rad = (a * Math.PI) / 180;
                const wave = Math.sin(rad * 2 - 0.65) * 32 + Math.cos(rad * 4 + 0.3) * 14;
                const val = Math.min(255, Math.max(180, Math.round(224 + wave)));
                ctx.strokeStyle = `rgb(${val},${val + 2},${val + 4})`;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(rad) * 512, cy + Math.sin(rad) * 512);
                ctx.stroke();
            }

            // Mikroskopik konsentrik ma'lumot yo'lakchalari
            for (let r = 135; r < 502; r += 3.5) {
                ctx.strokeStyle = (r % 56 === 0) ? 'rgba(15, 23, 42, 0.13)' : 'rgba(71, 85, 105, 0.06)';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(c);
            tex.anisotropy = 8;
            return tex;
        }

        // 2) 1-rasmdagi O'ng-pastki Zumrad-Yashil PCB Plata Teksturasi (Mis yo'laklar va Oltin Via-lar bilan)
        function makeRealisticGreenPCBTex() {
            const c = document.createElement('canvas');
            c.width = 1024;
            c.height = 1024;

            // Haqiqiy zumrad-yashil solder mask (#0b5d33)
            ctx.fillStyle = '#0d6338';
            ctx.fillRect(0, 0, 1024, 1024);

            // Ichki yorqinroq yashil mis shinalar (Copper traces)
            ctx.strokeStyle = '#19874e';
            ctx.lineWidth = 3.2;
            for (let i = 0; i < 160; i++) {
                const sx = 30 + (i * 47) % 960;
                const sy = 30 + (i * 67) % 960;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx + 38, sy + 38);
                ctx.lineTo(sx + 38, sy + 95);
                ctx.stroke();

                // Oltin va kumush kavshar nuqtalari (Vias & Test pads)
                ctx.fillStyle = (i % 3 === 0) ? '#fbbf24' : '#e2e8f0';
                ctx.beginPath();
                ctx.arc(sx, sy, 6.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#052e16';
                ctx.beginPath();
                ctx.arc(sx, sy, 2.4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Oq ipakografiya komponent konturlari
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
            ctx.lineWidth = 2;
            for (let j = 0; j < 36; j++) {
                const rx = 50 + (j * 97) % 880;

                ctx.strokeRect(rx, ry, 26, 15);
            }

                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {

                    pinX.position.set(0, -0.03, offset * d);

                    chipGrp.add(pinZ);

            const bShape = new THREE.Shape();

            bShape.lineTo(hw, -0.32);

            bShape.lineTo(-hw + 0.42, 1.16);
            bShape.lineTo(-hw, 1.16);

            bShape.lineTo(-hw + 0.48, -0.36); // M-key chuqurchasi

        function rebuildPinsAndPills() {
            pinsContainer.innerHTML = '';
            // "Barchasi" tugmasidan keyingi barcha pill tugmalarni tozalash
            while (pillsBar.children.length > 1) {
                pillsBar.removeChild(pillsBar.lastChild);
            }
            pinDOM = {};
            pillDOM = {};

            PARTS_DATA.forEach((part) => {
                // 1. Tashqi Perimetrdagi 3D Pin
                const pin = document.createElement('div');
                pin.className = 'pin-marker';
                pin.innerHTML = `
                    <span class="pin-num">${part.num}</span>
                    <span class="pin-label">${part.name}</span>
                `;
                pin.addEventListener('click', (e) => {
                    e.stopPropagation();
                    focusOnPart(part.id, true);
                });
                pinsContainer.appendChild(pin);
                pinDOM[part.id] = pin;

                // 2. Pastki Dockdagi 1..10 Tezkor Tanlash Tugmasi
                const pill = document.createElement('button');
                pill.className = 'part-pill px-2.5 py-1 rounded-full text-[10.5px] font-semibold bg-slate-800/70 hover:bg-slate-700 text-slate-200 border border-slate-600/40 whitespace-nowrap flex items-center gap-1.5 flex-shrink-0';
                pill.innerHTML = `<span class="w-4 h-4 rounded-full bg-sky-600 text-white text-[9.5px] font-extrabold flex items-center justify-center">${part.num}</span><span>${part.name}</span>`;
                pill.addEventListener('click', () => focusOnPart(part.id, true));
                pillsBar.appendChild(pill);
                pillDOM[part.id] = pill;
            });
        }

        rebuildPinsAndPills();

        // Pastki chap/o'ng skroll tugmalari
        document.getElementById('btn-scroll-left').addEventListener('click', () => {
            pillsBar.scrollBy({ left: -220, behavior: 'smooth' });
        });
        document.getElementById('btn-scroll-right').addEventListener('click', () => {
            pillsBar.scrollBy({ left: 220, behavior: 'smooth' });
        });

        // ============================================================================
        // 7. QURILMANI ALMASHTIRISH (HDD <-> SSD), KAMERA ZOOM VA VIEW REJIMLARI
        // ============================================================================
        let activePartId = null;
        let isPowered = true;
        let rpmSpeed = 7200; // 7200 yoki 600 (Slow-Mo)
        let pinsVisible = true;
        let isolatedMode = false;
        let currentViewMode = 'open'; // 'open', 'closed', 'explode'
        const state = { explode: 0 };

        const infoCard = document.getElementById('part-info-card');

        function getActiveCoverGroup() {
            if (currentDevice === 'hdd') return topCoverGroup;
            if (currentDevice === 'ssd') return ssdTopCoverGroup;
            return nvmeHeatsinkGroup;
        }
        function getActiveCoverMat() {
            if (currentDevice === 'hdd') return topCoverPlateMat;
            if (currentDevice === 'ssd') return ssdTopCoverMat;
            return nvmeHeatsinkMat;
        }
        function getActiveCoverId() {
            if (currentDevice === 'hdd') return 'top_cover';
            if (currentDevice === 'ssd') return 'ssd_top_cover';
            return 'nvme_heatsink';
        }

        function switchDevice(targetDev) {
            if (currentDevice === targetDev) return;
            currentDevice = targetDev;
            isolatedMode = false;
            activePartId = null;

            const btnHdd = document.getElementById('btn-device-hdd');
            const btnSdd = document.getElementById('btn-device-ssd');
            const btnNvme = document.getElementById('btn-device-nvme');
            const speedBtn = document.getElementById('btn-speed-toggle');

            // Barcha tugmalarni nofaol holatga keltirish
            [btnHdd, btnSdd, btnNvme].forEach(b => {
                b.className = 'device-switch-btn px-2.5 py-1 rounded-full text-[11px] font-extrabold tracking-tight opacity-75 hover:opacity-100 flex items-center gap-1';
            });

            hddModel.visible = false;
            ssdModel.visible = false;
            nvmeModel.visible = false;

            if (targetDev === 'hdd') {
                PARTS_DATA = HDD_PARTS_DATA;
                partGroups = hddPartGroups;
                clickableMeshes = hddClickableMeshes;
                hddModel.visible = true;

                btnHdd.className = 'device-switch-btn active-hdd px-2.5 py-1 rounded-full text-[11px] font-extrabold tracking-tight flex items-center gap-1';
                speedBtn.textContent = (rpmSpeed === 7200) ? '⏱️ 7200 RPM' : '⏱️ Slow-Mo';
            } else if (targetDev === 'ssd') {
                PARTS_DATA = SSD_PARTS_DATA;
                partGroups = ssdPartGroups;
                clickableMeshes = ssdClickableMeshes;
                ssdModel.visible = true;

                btnSdd.className = 'device-switch-btn active-ssd px-2.5 py-1 rounded-full text-[11px] font-extrabold tracking-tight flex items-center gap-1';
                speedBtn.textContent = (rpmSpeed === 7200) ? '⚡ 560 MB/s' : '⚡ Slow-Pulse';
            } else {
                PARTS_DATA = NVME_PARTS_DATA;
                partGroups = nvmePartGroups;
                clickableMeshes = nvmeClickableMeshes;
                nvmeModel.visible = true;

                btnNvme.className = 'device-switch-btn active-nvme px-2.5 py-1 rounded-full text-[11px] font-extrabold tracking-tight flex items-center gap-1';
                speedBtn.textContent = (rpmSpeed === 7200) ? '🚀 7450 MB/s' : '🚀 Slow-Pulse';
            }

            rebuildPinsAndPills();
            focusOnPart(null, false);
            setMainViewMode(currentViewMode);
        }

        document.getElementById('btn-device-hdd').addEventListener('click', () => switchDevice('hdd'));
        document.getElementById('btn-device-ssd').addEventListener('click', () => switchDevice('ssd'));
        document.getElementById('btn-device-nvme').addEventListener('click', () => switchDevice('nvme'));

        function setMainViewMode(mode) {
            currentViewMode = mode;
            const bOpen = document.getElementById('btn-view-open');
            const bClosed = document.getElementById('btn-view-closed');
            const bExplode = document.getElementById('btn-view-explode');

            const covGrp = getActiveCoverGroup();
            const covMat = getActiveCoverMat();
            const covId = getActiveCoverId();

            [bOpen, bClosed, bExplode].forEach(b => {
                b.className = 'px-3 py-1 rounded-full font-semibold opacity-75 hover:opacity-100 transition';
            });

            if (mode === 'open') {
                bOpen.className = 'px-3 py-1 rounded-full font-bold bg-sky-600 text-white shadow transition';
                gsap.to(state, { explode: 0, duration: 0.85, ease: 'power2.out', onUpdate: syncRangeUI });
                gsap.to(covMat, {
                    opacity: 0.0,
                    duration: 0.4,
                    onComplete: () => { if (currentViewMode === 'open' && activePartId !== covId) covGrp.visible = false; }
                });
                animateCameraTo(CAM_PRESETS.iso.pos, CAM_PRESETS.iso.target, 0.95);
            } else if (mode === 'closed') {
                bClosed.className = 'px-3 py-1 rounded-full font-bold bg-sky-600 text-white shadow transition';
                covGrp.visible = true;
                gsap.to(state, { explode: 0, duration: 0.85, ease: 'power2.out', onUpdate: syncRangeUI });
                gsap.to(covMat, { opacity: 1.0, duration: 0.55 });
                animateCameraTo(new THREE.Vector3(0.0, 11.2, 11.4), new THREE.Vector3(0.0, 0.25, 0.35), 0.95);
            } else if (mode === 'explode') {
                bExplode.className = 'px-3 py-1 rounded-full font-bold bg-amber-500 text-slate-950 shadow transition';
                covGrp.visible = true;
                gsap.to(covMat, { opacity: 0.92, duration: 0.5 });
                gsap.to(state, { explode: 1, duration: 1.05, ease: 'power2.inOut', onUpdate: syncRangeUI });
                animateCameraTo(new THREE.Vector3(10.8, 10.6, 13.4), new THREE.Vector3(0.0, 1.0, 0.0), 1.05);
            }
        }

        function syncRangeUI() {
            const pct = Math.round(state.explode * 100);
            document.getElementById('explode-range').value = pct;
            document.getElementById('explode-pct').textContent = `${pct}%`;
        }

        function animateCameraTo(posVec, targetVec, dur = 0.85) {
            gsap.to(camera.position, {
                x: posVec.x,
                y: posVec.y,
                z: posVec.z,
                duration: dur,
                ease: 'power3.out'
            });
            gsap.to(controls.target, {
                x: targetVec.x,
                y: targetVec.y,
                z: targetVec.z,
                duration: dur,
                ease: 'power3.out'
            });
        }

        function focusOnPart(partId, doZoom = true) {
            activePartId = partId;
            const part = PARTS_DATA.find(p => p.id === partId);
            const covGrp = getActiveCoverGroup();
            const covMat = getActiveCoverMat();
            const covId = getActiveCoverId();

            if (partId === covId) {
                covGrp.visible = true;
                gsap.to(covMat, { opacity: 0.96, duration: 0.45 });
            } else if (partId && state.explode < 0.15) {
                gsap.to(covMat, {
                    opacity: 0.0,
                    duration: 0.35,
                    onComplete: () => { if (activePartId !== covId && state.explode < 0.15) covGrp.visible = false; }
                });
            }

            // Tanlangan detalga engil nurlanish berish
            clickableMeshes.forEach(m => {
                if (m.material && m.material.emissive) {
                    if (m.userData.partId === partId) {
                        m.material.emissive.setHex(0x0284c7);
                        m.material.emissiveIntensity = 0.38;
                    } else {
                        m.material.emissive.copy(m.userData.origEmissive);
                        m.material.emissiveIntensity = 1.0;
                    }
                }
            });

            // Pinlar va pastki tugmalar holati
            PARTS_DATA.forEach(p => {
                const isAct = (p.id === partId);
                if (pinDOM[p.id]) pinDOM[p.id].classList.toggle('active', isAct);
                if (pillDOM[p.id]) {
                    pillDOM[p.id].classList.toggle('active', isAct);
                    if (isAct) {
                        pillDOM[p.id].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    }
                }
            });
            document.getElementById('btn-all-parts').className = partId
                ? 'px-2.5 py-1 rounded-full text-[10.5px] font-semibold bg-slate-800/70 hover:bg-slate-700 text-slate-200 whitespace-nowrap transition flex-shrink-0'
                : 'px-2.5 py-1 rounded-full text-[10.5px] font-bold bg-sky-600 text-white whitespace-nowrap transition flex-shrink-0';

            // Yakka ko'rish (Isolate) rejimi
            if (isolatedMode && partId) {
                Object.keys(partGroups).forEach(k => { partGroups[k].visible = (k === partId); });
                if (currentDevice === 'hdd') chassisGroup.visible = false;
            } else {
                Object.keys(partGroups).forEach(k => {
                    if (k === covId && state.explode < 0.15 && currentViewMode === 'open' && partId !== covId) {
                        partGroups[k].visible = false;
                    } else {
                        partGroups[k].visible = true;
                    }
                });
                if (currentDevice === 'hdd') chassisGroup.visible = true;
            }

            if (part) {
                // O'ng-yuqori ixcham ma'lumot kartochkasini ko'rsatish
                document.getElementById('card-num').textContent = part.num;
                document.getElementById('card-title').textContent = part.name;
                document.getElementById('card-en').textContent = part.en;
                document.getElementById('card-desc').textContent = part.desc;
                document.getElementById('card-specs').innerHTML = part.specs.map(s => `<div>${s}</div>`).join('');

                infoCard.classList.remove('opacity-0', 'pointer-events-none', 'translate-x-6');
                infoCard.classList.add('opacity-100', 'pointer-events-auto', 'translate-x-0');

                if (doZoom) {
                    const grp = partGroups[part.id];
                    const curOffset = grp ? grp.position : new THREE.Vector3();
                    animateCameraTo(
                        part.zoomCam.clone().add(curOffset),
                        part.zoomTarget.clone().add(curOffset),
                        0.85
                    );
                }
            } else {
                infoCard.classList.add('opacity-0', 'pointer-events-none', 'translate-x-6');
                infoCard.classList.remove('opacity-100', 'pointer-events-auto', 'translate-x-0');
            }
        }

        // ============================================================================
        // 8. RAYCASTING (3D DETAL USTIGA BOSISH) VA TUGMALARNI BOG'LASH
        // ============================================================================
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let downCoords = { x: 0, y: 0 };

        renderer.domElement.addEventListener('pointerdown', (e) => {
            downCoords = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            if (Math.hypot(e.clientX - downCoords.x, e.clientY - downCoords.y) > 5) return;
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            const activeMeshes = clickableMeshes.filter(m => {
                const grp = partGroups[m.userData.partId];
                return grp && grp.visible;
            });

            const hits = raycaster.intersectObjects(activeMeshes, false);
            if (hits.length > 0) {
                const hitPartId = hits[0].object.userData.partId;
                if (hitPartId) focusOnPart(hitPartId, true);
            }
        });

        // Yuqori va pastki boshqaruv tugmalari
        document.getElementById('btn-view-open').addEventListener('click', () => {
            isolatedMode = false;
            focusOnPart(null, false);
            setMainViewMode('open');
        });
        document.getElementById('btn-view-closed').addEventListener('click', () => {
            isolatedMode = false;
            focusOnPart(null, false);
            setMainViewMode('closed');
        });
        document.getElementById('btn-view-explode').addEventListener('click', () => {
            isolatedMode = false;
            focusOnPart(null, false);
            setMainViewMode('explode');
        });

        document.getElementById('cam-iso').addEventListener('click', () => animateCameraTo(CAM_PRESETS.iso.pos, CAM_PRESETS.iso.target));
        document.getElementById('cam-top').addEventListener('click', () => animateCameraTo(CAM_PRESETS.top.pos, CAM_PRESETS.top.target));
        document.getElementById('cam-front').addEventListener('click', () => animateCameraTo(CAM_PRESETS.front.pos, CAM_PRESETS.front.target));

        document.getElementById('btn-theme').addEventListener('click', () => {
            document.body.classList.toggle('studio-light');
        });

        document.getElementById('btn-close-card').addEventListener('click', () => {
            isolatedMode = false;
            document.getElementById('btn-card-isolate').textContent = '👁️ Yakka o\'zi';
            focusOnPart(null, false);
            animateCameraTo(CAM_PRESETS.iso.pos, CAM_PRESETS.iso.target);
        });

        document.getElementById('btn-card-zoom').addEventListener('click', () => {
            if (!activePartId) return;
            const part = PARTS_DATA.find(p => p.id === activePartId);
            const grp = partGroups[part.id];
            const curOffset = grp ? grp.position : new THREE.Vector3();
            // Yana 35% yaqinroq Makro Zoom
            const dir = part.zoomCam.clone().sub(part.zoomTarget).multiplyScalar(0.62);
            animateCameraTo(part.zoomTarget.clone().add(curOffset).add(dir), part.zoomTarget.clone().add(curOffset), 0.75);
        });

        document.getElementById('btn-card-isolate').addEventListener('click', (e) => {
            if (!activePartId) return;
            isolatedMode = !isolatedMode;
            e.currentTarget.textContent = isolatedMode ? '🔄 Barchasi' : '👁️ Yakka o\'zi';
            focusOnPart(activePartId, true);
        });

        document.getElementById('btn-all-parts').addEventListener('click', () => {
            isolatedMode = false;
            document.getElementById('btn-card-isolate').textContent = '👁️ Yakka o\'zi';
            focusOnPart(null, false);
            setMainViewMode('open');
        });

        document.getElementById('explode-range').addEventListener('input', (e) => {
            state.explode = parseFloat(e.target.value) / 100;
            syncRangeUI();
            const covGrp = getActiveCoverGroup();
            const covMat = getActiveCoverMat();
            const covId = getActiveCoverId();
            if (state.explode > 0.08) {
                covGrp.visible = true;
                covMat.opacity = Math.min(0.92, state.explode * 1.2);
            } else if (currentViewMode === 'open' && activePartId !== covId) {
                covMat.opacity = 0.0;
                covGrp.visible = false;
            }
        });

        document.getElementById('btn-quick-assemble').addEventListener('click', () => setMainViewMode('open'));
        document.getElementById('btn-quick-explode').addEventListener('click', () => setMainViewMode('explode'));

        document.getElementById('btn-power-toggle').addEventListener('click', (e) => {
            isPowered = !isPowered;
            const led = document.getElementById('status-led');
            if (isPowered) {
                e.currentTarget.textContent = '⚡ Quvvat: ON';
                e.currentTarget.className = 'px-3 py-1 rounded-full bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/40 text-emerald-300 text-[11px] font-bold transition';
                led.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]';
            } else {
                e.currentTarget.textContent = (currentDevice === 'hdd') ? '⚡ Parkovka (OFF)' : '⚡ Kutish (OFF)';
                e.currentTarget.className = 'px-3 py-1 rounded-full bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-amber-300 text-[11px] font-bold transition';
                led.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_10px_#fbbf24]';
            }
        });

        document.getElementById('btn-speed-toggle').addEventListener('click', (e) => {
            rpmSpeed = (rpmSpeed === 7200) ? 600 : 7200;
            if (currentDevice === 'hdd') {
                e.currentTarget.textContent = (rpmSpeed === 7200) ? '⏱️ 7200 RPM' : '⏱️ Slow-Mo';
            } else if (currentDevice === 'ssd') {
                e.currentTarget.textContent = (rpmSpeed === 7200) ? '⚡ 560 MB/s' : '⚡ Slow-Pulse';
            } else {
                e.currentTarget.textContent = (rpmSpeed === 7200) ? '🚀 7450 MB/s' : '🚀 Slow-Pulse';
            }
        });

        document.getElementById('btn-pins-toggle').addEventListener('click', (e) => {
            pinsVisible = !pinsVisible;
            pinsContainer.style.display = pinsVisible ? 'block' : 'none';
            svgOverlay.style.display = pinsVisible ? 'block' : 'none';
            e.currentTarget.textContent = pinsVisible ? '🏷️ Raqamlar: ON' : '🏷️ Raqamlar: OFF';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================================
        // 9. JONLI ANIMATSIYA VA TASHQI PERIMETR CALLOUT CHIZIQLARI
        // ============================================================================
        let angularVelocity = 0.46;
        let currentArmAngle = 0.0;
        let targetArmAngle = 0.0;
        let seekTimer = 0;
        const clock = new THREE.Clock();

        function renderCalloutPins() {
            if (!pinsVisible) return;
            const w = window.innerWidth;
            const h = window.innerHeight;
            const hw = w / 2;
            const hh = h / 2;

            let svgContent = '';

            PARTS_DATA.forEach(part => {
                const grp = partGroups[part.id];
                const pinEl = pinDOM[part.id];
                if (!grp || !pinEl) return;

                // Agar #5 Top Cover yashirin bo'lsa va tanlanmagan bo'lsa, faqat burchakdagi nuqtasiga bog'laymiz
                if (isolatedMode && !grp.visible) {
                    pinEl.style.opacity = '0';
                    pinEl.style.pointerEvents = 'none';
                    return;
                }

                const worldAnchor = part.anchorLocal.clone().add(grp.position);
                const worldPin = part.pinOuter.clone().add(grp.position.clone().multiplyScalar(0.5));

                const pA = worldAnchor.project(camera);
                const pB = worldPin.project(camera);

                if (pA.z > 1 || pB.z > 1) {
                    pinEl.style.opacity = '0';
                    pinEl.style.pointerEvents = 'none';
                    return;
                }

                const ax = (pA.x * hw) + hw;
                const ay = -(pA.y * hh) + hh;
                const bx = (pB.x * hw) + hw;
                const by = -(pB.y * hh) + hh;

                pinEl.style.left = `${bx}px`;
                pinEl.style.top = `${by}px`;
                pinEl.style.opacity = '1';
                pinEl.style.pointerEvents = 'auto';

                const isAct = (activePartId === part.id);
                const strokeColor = isAct ? '#f59e0b' : 'rgba(56, 189, 248, 0.72)';
                const strokeWidth = isAct ? 2.2 : 1.35;

                svgContent += `
                    <line x1="${bx}" y1="${by}" x2="${ax}" y2="${ay}" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-dasharray="${isAct ? 'none' : '4,3'}" />
                    <circle cx="${ax}" cy="${ay}" r="${isAct ? 4.5 : 3}" fill="${isAct ? '#f59e0b' : '#38bdf8'}" stroke="#ffffff" stroke-width="1.2" />
                `;
            });

            svgOverlay.innerHTML = svgContent;
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            // 1. Faol qurilma (HDD yoki SSD) qismlarini Parchalash (Explode) interpolatsiyasi
            PARTS_DATA.forEach(part => {
                const grp = partGroups[part.id];
                if (grp) {
                    grp.position.lerpVectors(grp.userData.basePos, part.explodeOffset, state.explode);
                }
            });

            if (currentDevice === 'hdd') {
                // 4 ta plastinaning parchalanganda vertikal ochilishi
                individualPlatters.forEach(layer => {
                    const spreadY = (layer.userData.index - 1.5) * 0.46 * state.explode;
                    layer.position.y = layer.userData.baseY + spreadY;
                });

                // 2. Plastinalar va Shpindel aylanishi
                const targetVel = isPowered ? (rpmSpeed === 7200 ? 0.46 : 0.05) : 0.0;
                angularVelocity += (targetVel - angularVelocity) * (isPowered ? 0.06 : 0.035);

                plattersSpinGroup.rotation.y -= angularVelocity;
                spindleSpinGroup.rotation.y -= angularVelocity;

                const liveRPM = Math.round((angularVelocity / 0.46) * 7200);
                document.getElementById('rpm-readout').textContent = `${liveRPM} RPM`;

                // 3. Aktuator qo'li (#3) va O'qish/Yozish kallagi (#4) harakati
                if (isPowered) {
                    seekTimer -= dt;
                    if (seekTimer <= 0) {
                        targetArmAngle = -0.04 + Math.random() * 0.30;
                        seekTimer = (rpmSpeed === 600) ? 1.0 : (0.20 + Math.random() * 0.42);
                    }
                    const servoJitter = Math.sin(elapsed * 45) * 0.004;
                    currentArmAngle += ((targetArmAngle + servoJitter) - currentArmAngle) * 0.18;
                } else {
                    // Quvvat o'chirilganda kallak #7 To'q sariq Parkovka rampasiga (-0.34 rad) chiqadi
                    currentArmAngle += (-0.34 - currentArmAngle) * 0.08;
                }

                actuatorPivotNode.rotation.y = currentArmAngle;
                headPivotNode.rotation.y = currentArmAngle;
            } else if (currentDevice === 'ssd') {
                // SATA SSD REJIMI: Jonli elektron ma'lumot paketlarining PCB shinalari bo'ylab oqimi
                const pulseSpeedFactor = isPowered ? (rpmSpeed === 7200 ? 1.0 : 0.22) : 0.0;
                const liveMBs = isPowered ? (rpmSpeed === 7200 ? (545 + Math.round(Math.sin(elapsed * 9) * 15)) : 120) : 0;
                document.getElementById('rpm-readout').textContent = `${liveMBs} MB/s`;

                ssdDataPulses.forEach(p => {
                    p.mesh.visible = isPowered;
                    if (!isPowered) return;
                    p.t = (p.t + dt * p.speed * pulseSpeedFactor) % 1.0;
                    if (p.t < 0.5) {
                        p.mesh.position.lerpVectors(p.p0, p.p1, p.t * 2.0);
                    } else {
                        p.mesh.position.lerpVectors(p.p1, p.p2, (p.t - 0.5) * 2.0);
                    }
                });
            } else {
                // M.2 NVMe SSD REJIMI: PCIe 4.0 x4 (7450 MB/s) yuqori tezlikdagi impulslar
                const pulseSpeedFactor = isPowered ? (rpmSpeed === 7200 ? 1.0 : 0.20) : 0.0;
                const liveNVMeMBs = isPowered ? (rpmSpeed === 7200 ? (7420 + Math.round(Math.sin(elapsed * 14) * 30)) : 1450) : 0;
                document.getElementById('rpm-readout').textContent = `${liveNVMeMBs} MB/s`;

                nvmeDataPulses.forEach(p => {
                    p.mesh.visible = isPowered;
                    if (!isPowered) return;
                    p.t = (p.t + dt * p.speed * pulseSpeedFactor) % 1.0;
                    if (p.t < 0.5) {
                        p.mesh.position.lerpVectors(p.p0, p.p1, p.t * 2.0);
                    } else {
                        p.mesh.position.lerpVectors(p.p1, p.p2, (p.t - 0.5) * 2.0);
                    }
                });
            }

            controls.update();
            renderCalloutPins();
            renderer.render(scene, camera);
        }

        window.onload = function () {
            animate();
        };
    </script>
</body>
</html>
